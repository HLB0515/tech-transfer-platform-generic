<style>
:root {
  --bg: #edf7fb;
  --panel: rgba(255, 255, 255, 0.78);
  --panel-strong: rgba(248, 252, 255, 0.9);
  --line: rgba(158, 205, 226, 0.52);
  --text: #122033;
  --muted: #637589;
  --primary: #067a8a;
  --primary-dark: #075869;
  --accent: #f59e0b;
  --blue: #246bfe;
  --cyan: #05b6d6;
  --violet: #8b5cf6;
  --pink: #ec4899;
  --green-soft: #e4f8f5;
  --orange-soft: #fff4df;
  --shadow: 0 24px 70px rgba(21, 77, 112, 0.14);
  --jelly-border: 1px solid rgba(255, 255, 255, 0.62);
  font-family: Inter, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
}

/* Premium tech-blue visual refresh */
:root {
  --bg: #061121;
  --panel: rgba(9, 31, 58, 0.66);
  --panel-strong: rgba(12, 45, 82, 0.78);
  --line: rgba(103, 232, 249, 0.28);
  --text: #eaf7ff;
  --muted: #9dc4d8;
  --primary: #19b8ff;
  --primary-dark: #1463ff;
  --accent: #8bffcc;
  --blue: #2f7bff;
  --cyan: #2ee8ff;
  --violet: #8f7cff;
  --shadow: 0 28px 80px rgba(0, 15, 38, 0.42);
}

body {
  background:
    radial-gradient(circle at 18% 8%, rgba(34, 211, 238, 0.22), transparent 28%),
    radial-gradient(circle at 82% 10%, rgba(47, 123, 255, 0.2), transparent 30%),
    radial-gradient(circle at 72% 70%, rgba(139, 124, 255, 0.16), transparent 34%),
    linear-gradient(180deg, #061121 0%, #07182e 44%, #081f37 100%);
  color: var(--text);
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -2;
  background-image:
    linear-gradient(rgba(103, 232, 249, 0.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(103, 232, 249, 0.045) 1px, transparent 1px);
  background-size: 42px 42px;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(circle at 12% 78%, rgba(46, 232, 255, 0.16), transparent 18%),
    linear-gradient(115deg, transparent 0 34%, rgba(46, 232, 255, 0.06) 36%, transparent 38% 100%);
  mix-blend-mode: screen;
}

.app-shell,
.app-shell.portal-shell {
  background: transparent;
}

.content,
.app-shell.portal-shell .content {
  max-width: 1680px;
  padding: 28px 34px 54px;
}

.sidebar,
.sidebar.site-header,
.app-shell.portal-shell .sidebar.site-header,
.topbar,
.app-shell.portal-shell .topbar {
  background:
    linear-gradient(90deg, rgba(5, 14, 31, 0.88), rgba(6, 42, 74, 0.72)),
    linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.02));
  border-color: rgba(103, 232, 249, 0.24);
  box-shadow: 0 18px 46px rgba(0, 15, 38, 0.38);
  backdrop-filter: blur(22px);
}

.brand,
.topbar-brand {
  color: #f8fdff;
}

.brand span,
.topbar-search,
.user-pill,
.eyebrow {
  color: #9ecfea;
}

.panel,
.card,
.stat,
.portal-stat,
.service-card,
.scenario-card,
.news-card,
.market-hall,
.nstl-nav-panel,
.hero-ai-card,
.hero-glass-card,
.home-match-platform,
.knowledge-discovery,
.province-map-card,
.cockpit-kpis article,
.visual-card,
.demo-mode-panel,
.agent-collab-map,
.industry-chain-scenes,
.success-case-section {
  color: #eaf7ff;
  border: 1px solid rgba(103, 232, 249, 0.24);
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.045)),
    linear-gradient(135deg, rgba(6, 31, 58, 0.82), rgba(8, 57, 92, 0.62));
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.24),
    inset 0 -18px 44px rgba(10, 143, 210, 0.06),
    0 22px 64px rgba(0, 14, 38, 0.34);
  backdrop-filter: blur(22px);
}

.panel::before,
.card::before,
.portal-stat::before,
.service-card::before,
.scenario-card::before,
.news-card::before,
.market-hall::before {
  display: block;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(103, 232, 249, 0.92), rgba(139, 124, 255, 0.68), transparent);
}

.panel::after,
.card::after,
.service-card::after,
.scenario-card::after,
.news-card::after,
.market-hall::after {
  display: block;
  border-color: rgba(255, 255, 255, 0.16);
}

.primary,
.secondary,
.ghost,
.nav button,
.topbar-nav button,
.hero-prompt-row button,
.hero-icon-grid button,
.nstl-nav-list button,
.nstl-feature-list button,
.admin-tabs button {
  position: relative;
  overflow: hidden;
  min-height: 42px;
  border-radius: 999px;
  border: 1px solid rgba(125, 211, 252, 0.34);
  color: #eaf7ff;
  background:
    radial-gradient(circle at 24% 14%, rgba(255,255,255,.62), transparent 14%),
    linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.06)),
    linear-gradient(135deg, rgba(37, 99, 235, .76), rgba(6, 182, 212, .58));
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.38),
    inset 0 -12px 28px rgba(0, 31, 68, .24),
    0 12px 30px rgba(14, 165, 233, .22);
  backdrop-filter: blur(16px);
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}

.topbar-nav button,
.nav button {
  min-width: 96px !important;
  min-height: 50px !important;
  padding: 0 18px !important;
  border-radius: 18px !important;
}

.topbar-nav button.active,
.nav button.active {
  color: #03111f !important;
  background:
    radial-gradient(circle at 24% 16%, rgba(255,255,255,.86), transparent 16%),
    linear-gradient(135deg, #a7f3d0, #67e8f9 48%, #60a5fa) !important;
}

.primary::before,
.secondary::before,
.ghost::before,
.nav button::before,
.topbar-nav button::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(115deg, transparent 0 36%, rgba(255,255,255,.34) 46%, transparent 58% 100%);
  transform: translateX(-115%);
  transition: transform .55s ease;
}

.primary:hover,
.secondary:hover,
.ghost:hover,
.nav button:hover,
.nav button.active,
.topbar-nav button:hover,
.topbar-nav button.active {
  transform: translateY(-2px);
  border-color: rgba(167, 243, 208, 0.7);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.48),
    inset 0 -14px 30px rgba(0, 31, 68, .26),
    0 0 0 1px rgba(103, 232, 249, 0.16),
    0 18px 42px rgba(34, 211, 238, .28);
}

.primary:hover::before,
.secondary:hover::before,
.ghost:hover::before,
.nav button:hover::before,
.topbar-nav button:hover::before {
  transform: translateX(115%);
}

.primary {
  color: #03111f;
  background:
    radial-gradient(circle at 24% 16%, rgba(255,255,255,.84), transparent 16%),
    linear-gradient(135deg, #9dfcff, #2ee8ff 48%, #2f7bff);

}

.secondary {

}

.ghost {

}

input,
select,
textarea,
.hero-ai-input {
  color: #eaf7ff;

}

input::placeholder,
textarea::placeholder {

}

input:focus,
select:focus,
textarea:focus {

}

.side-tool-dock {

  width: 64px;
  border-radius: 22px;
  padding: 8px;
  background: rgba(4, 16, 34, 0.58);

}

.side-tool-dock button {

}

.side-tool-dock button::first-letter {

}

.portal {
  gap: 24px;
}

.portal-hero,
.leadership-cockpit {

    radial-gradient(circle at 20% 26%, rgba(46, 232, 255, 0.22), transparent 24%),
    radial-gradient(circle at 84% 28%, rgba(143, 124, 255, 0.2), transparent 28%),
    linear-gradient(135deg, rgba(5, 14, 31, 0.94), rgba(7, 43, 78, 0.86) 46%, rgba(7, 88, 99, 0.78)),

  box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 34px 96px rgba(0, 14, 38, 0.48);
}

.portal-hero::after {
  background:
    linear-gradient(90deg, rgba(4, 12, 28, 0.82), rgba(4, 19, 38, 0.58), rgba(4, 19, 38, 0.22)),
    radial-gradient(circle at 76% 30%, rgba(46, 232, 255, 0.14), transparent 30%);
}

.portal-hero h2,
.portal-hero h3,
.portal-hero p,
.hero-ai-head b,
.hero-glass-card h3,
.knowledge-discovery h2,
.home-match-platform h2,
.panel h2,
.panel h3 {

}

.portal-hero h2,
.cockpit-copy h2 {

}

.portal-hero p,
.portal-hero h3,
.home-match-copy p,
.home-match-panel p,
.hero-ai-head span,

.knowledge-chip,
.market-panel,

.hero-ai-card,
.nstl-search-card {
  background:
    linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.06)),

.search-mode-tabs {

.hero-ai-answer,
.resource-checks span,
.knowledge-chip,
.home-match-panel article,

.demo-mode-panel,
.industry-chain-scenes,
.success-case-section {
  color: #eaf7ff;

.agent-collab-map {

.agent-collab-map .panel-header strong {

.agent-orbit-map {

    radial-gradient(circle at 22% 14%, rgba(255,255,255,.34), transparent 16%),

}

.agent-node.a3 {
  right: 5%;

}

.agent-node.a4 {
  right: 5%;
  top: 52%;
}

.collab-stream-board {
  left: 50%;
  right: auto;
  top: 18px;
  width: min(360px, 34%);
  transform: translateX(-50%);
}

.collab-stream-board p {
  background:
    linear-gradient(90deg, rgba(14, 165, 233, .22), rgba(15, 23, 42, .32));
  border-color: rgba(103, 232, 249, .24);
}

.collab-timeline p {
  background:
    linear-gradient(180deg, rgba(255,255,255,.13), rgba(255,255,255,.04)),

.report-core {
  background:
    radial-gradient(circle at 30% 20%, rgba(255,255,255,.78), transparent 16%),

  box-shadow:

    0 0 95px rgba(46, 232, 255, 0.58),

}

.cockpit-status-strip span,
.city-dot,
.funnel-row,
.live-ticker p {
  background:
    radial-gradient(circle at 22% 14%, rgba(255,255,255,.32), transparent 16%),
    linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.05));

@media (max-width: 760px) {
  .content,
  .app-shell.portal-shell .content {
    padding: 18px 14px 34px;
  }

  .agent-collab-map {
    padding: 16px;
  }

  .agent-orbit-map {
    min-height: 600px;
  }

  .collab-stream-board {
    display: none;
  }

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background:
    radial-gradient(circle at 12% -8%, rgba(34, 211, 238, 0.22), transparent 32%),
    radial-gradient(circle at 88% 4%, rgba(139, 92, 246, 0.16), transparent 28%),
    radial-gradient(circle at 50% 48%, rgba(20, 184, 166, 0.1), transparent 32%),
    linear-gradient(180deg, #f3fbff 0%, #f8fbff 44%, #edf7fb 100%);
  color: var(--text);
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  border: 0;
  cursor: pointer;
}

.app-shell {
  min-height: 100vh;
  display: block;
}

.sidebar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  background:
    linear-gradient(90deg, rgba(4, 20, 33, 0.96), rgba(8, 68, 84, 0.96)),
    repeating-linear-gradient(90deg, rgba(255,255,255,0.06) 0, rgba(255,255,255,0.06) 1px, transparent 1px, transparent 56px);
  color: #f7fbfa;
  padding: 15px 28px;
  border-bottom: 1px solid rgba(125, 211, 252, 0.22);
  box-shadow: 0 16px 42px rgba(4, 20, 33, 0.25);
}

.brand {
  display: grid;
  gap: 6px;
  padding: 0;
  min-width: 260px;
}

.brand strong {
  font-size: 21px;
  line-height: 1.25;
}

.brand span {
  color: #b7d2cd;
  font-size: 13px;
}

.nav {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: center;
}

.nav button {
  color: #d9f4f7;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 999px;
  padding: 10px 12px;
  text-align: center;
  font-size: 14px;
  backdrop-filter: blur(10px);
}

.nav button.active,
.nav button:hover {
  background: linear-gradient(135deg, rgba(34, 211, 238, 0.26), rgba(139, 92, 246, 0.18));
  border-color: rgba(125, 211, 252, 0.52);
  color: #ffffff;
  box-shadow: 0 0 28px rgba(34, 211, 238, 0.18);
}

.main {
  min-width: 0;
}

.topbar {
  min-height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  background: rgba(255, 255, 255, 0.58);
  border-bottom: 1px solid rgba(255, 255, 255, 0.72);
  backdrop-filter: blur(18px);
}

.topbar h1 {
  margin: 0;
  font-size: 20px;
}

.topbar-home {
  justify-content: flex-end;
}

.user-pill {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--muted);
  font-size: 14px;
}

.avatar {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: #fff;
  background: var(--primary);
  font-weight: 700;
}

.content {
  max-width: 1560px;
  margin: 0 auto;
  padding: 26px 28px 42px;
}

.grid {
  display: grid;
  gap: 16px;
}

.stats {
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
}

.stat,
.panel,
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(18px);
}

.panel,
.card,
.portal-stat,
.service-card,
.scenario-card,
.news-card,
.market-hall {
  position: relative;
  overflow: hidden;
}

.panel::before,
.card::before,
.portal-stat::before,
.service-card::before,
.scenario-card::before,
.news-card::before,
.market-hall::before {
  content: "";
  position: absolute;
  inset: 0 0 auto;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(34, 211, 238, 0.86), rgba(139, 92, 246, 0.52), transparent);
  pointer-events: none;
}

.panel::after,
.card::after,
.service-card::after,
.scenario-card::after,
.news-card::after,
.market-hall::after {
  content: "";
  position: absolute;
  inset: 1px;
  border-radius: inherit;
  border: var(--jelly-border);
  pointer-events: none;
  opacity: 0.46;
}

.stat {
  padding: 18px;
}

.stat span,
.eyebrow {
  color: var(--muted);
  font-size: 13px;
}

.stat strong {
  display: block;
  margin-top: 8px;
  font-size: 28px;
}

.layout-two {
  display: grid;
  grid-template-columns: minmax(0, 1.2fr) minmax(340px, 0.8fr);
  gap: 18px;
  align-items: start;
}

.panel {
  padding: 20px;
}

.panel-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 16px;
}

.panel h2 {
  margin: 0 0 4px;
  font-size: 18px;
}

.panel p {
  color: var(--muted);
  line-height: 1.65;
}

.filters {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 180px auto;
  gap: 10px;
  margin-bottom: 14px;
}

.result-hint {
  margin: 0 0 16px;
  padding: 12px 16px;
  border: 1px solid rgba(49, 124, 255, 0.18);
  border-radius: 14px;
  background: linear-gradient(135deg, rgba(236, 247, 255, 0.92), rgba(255, 255, 255, 0.76));
  color: #45607a;
  font-size: 14px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.76);
}

.field,
.form-grid {
  display: grid;
  gap: 7px;
}

.form-grid {
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

label {
  color: #425062;
  font-size: 13px;
}

input,
select,
textarea {
  width: 100%;
  border: 1px solid rgba(148, 209, 235, 0.68);
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.74);
  padding: 10px 11px;
  color: var(--text);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72);
  backdrop-filter: blur(12px);
}

input:focus,
select:focus,
textarea:focus {
  outline: 0;
  border-color: rgba(34, 211, 238, 0.9);
  box-shadow: 0 0 0 4px rgba(34, 211, 238, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.82);
}

textarea {
  min-height: 92px;
  resize: vertical;
}

.wide {
  grid-column: 1 / -1;
}

.primary,
.secondary,
.ghost {
  min-height: 38px;
  border-radius: 999px;
  padding: 0 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  white-space: nowrap;
  border: 1px solid rgba(255, 255, 255, 0.52);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.62), 0 14px 26px rgba(20, 83, 116, 0.12);
  backdrop-filter: blur(14px);
  transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
}

.primary:hover,
.secondary:hover,
.ghost:hover {
  transform: translateY(-1px);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75), 0 18px 34px rgba(20, 83, 116, 0.2);
}

.primary {
  color: #fff;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.22), transparent 42%),
    linear-gradient(135deg, #06b6d4, #246bfe 62%, #8b5cf6);
}

.primary:hover {
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.3), transparent 42%),
    linear-gradient(135deg, #0ea5e9, #2563eb 62%, #7c3aed);
}

.secondary {
  color: #075869;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.2)),
    linear-gradient(135deg, rgba(224, 251, 255, 0.92), rgba(196, 255, 234, 0.82));
}

.ghost {
  color: var(--text);
  background: rgba(255, 255, 255, 0.56);
}

.list {
  display: grid;
  gap: 12px;
}

.catalog-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
  gap: 14px;
}

.card {
  padding: 16px;
  box-shadow: none;
}

.card h3 {
  margin: 0 0 8px;
  font-size: 16px;
}

.expert-card {
  display: grid;
  align-content: start;
  gap: 8px;
  min-height: 270px;
}

.expert-card-pro {
  min-height: 330px;
  background:
    linear-gradient(180deg, rgba(255,255,255,0.96), rgba(244, 251, 255, 0.96));
  border-color: #cfe5f0;
}

.expert-card small {
  color: var(--muted);
  line-height: 1.6;
}

.expert-head {
  display: flex;
  align-items: center;
  gap: 10px;
}

.expert-avatar {
  background: linear-gradient(135deg, #067a8a, #246bfe);
}

.expert-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: auto;
}

.meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 10px 0;
}

.tag {
  display: inline-flex;
  align-items: center;
  min-height: 24px;
  border-radius: 999px;
  background: #eef2f6;
  color: #425062;
  padding: 2px 9px;
  font-size: 12px;
}

.tag.accent {
  background: var(--orange-soft);
  color: var(--accent);
}

.match-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: center;
}

.score {
  width: 78px;
  height: 78px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background:
    radial-gradient(circle at center, #fff 0 54%, transparent 55%),
    conic-gradient(#0f766e 0 78%, #f59e0b 78% 92%, #e2e8f0 92% 100%);
  color: var(--primary-dark);
  font-weight: 800;
  box-shadow: 0 10px 24px rgba(15, 118, 110, 0.18);
}

.match-ai-cockpit {
  display: grid;
  gap: 16px;
  overflow: hidden;
  color: #eaf7ff;
  background:
    radial-gradient(circle at 20% 12%, rgba(34, 211, 238, 0.28), transparent 30%),
    radial-gradient(circle at 82% 30%, rgba(139, 92, 246, 0.22), transparent 28%),
    linear-gradient(145deg, rgba(9, 24, 55, 0.94), rgba(6, 68, 91, 0.86));
  border-color: rgba(125, 211, 252, 0.28);
}

.cockpit-glow {
  position: absolute;
  right: -90px;
  top: -120px;
  width: 260px;
  height: 260px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(34, 211, 238, 0.42), transparent 62%);
  pointer-events: none;
}

.cockpit-head {
  position: relative;
}

.cockpit-head h2,
.cockpit-head p {
  margin: 0;
}

.match-ai-cockpit .eyebrow,
.cockpit-head p {
  color: #bfe9f5;
}

.cockpit-score {
  position: relative;
  display: grid;
  grid-template-columns: 132px minmax(0, 1fr);
  gap: 16px;
  align-items: center;
  padding: 14px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(186, 230, 253, 0.24);
}

.score-orbit {
  position: relative;
  width: 118px;
  height: 118px;
  display: grid;
  place-items: center;
  align-content: center;
  border-radius: 50%;
  background:
    radial-gradient(circle at center, rgba(15, 23, 42, 0.92) 0 56%, transparent 58%),
    conic-gradient(#22d3ee 0 78%, #a78bfa 78% 92%, rgba(255, 255, 255, 0.16) 92% 100%);
  box-shadow: 0 0 34px rgba(34, 211, 238, 0.22);
}

.score-orbit::after {
  content: "";
  position: absolute;
  inset: -8px;
  border-radius: inherit;
  border: 1px dashed rgba(125, 211, 252, 0.4);
  animation: radarSweep 8s linear infinite;
}

.score-orbit strong {
  color: #fff;
  font-size: 28px;
}

.score-orbit span,
.cockpit-score small {
  color: #adc7d8;
  font-size: 12px;
}

.cockpit-score b {
  display: block;
  margin-bottom: 6px;
  color: #fff;
}

.ai-flow-map {
  position: relative;
  display: grid;
  gap: 10px;
  padding: 12px;
  border-radius: 18px;
  background: rgba(15, 23, 42, 0.4);
  border: 1px solid rgba(125, 211, 252, 0.18);
}

.ai-flow-map::before {
  content: "";
  position: absolute;
  left: 32px;
  top: 24px;
  bottom: 24px;
  width: 2px;
  background: linear-gradient(#22d3ee, #a78bfa, #34d399);
  opacity: 0.65;
}

.flow-node {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: 42px minmax(0, 1fr);
  gap: 10px;
  align-items: center;
}

.flow-node i {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  color: #ffffff;
  background: linear-gradient(135deg, rgba(34, 211, 238, 0.86), rgba(139, 92, 246, 0.82));
  font-style: normal;
  font-weight: 900;
  box-shadow: 0 10px 24px rgba(34, 211, 238, 0.18);
}

.flow-node span {
  color: #dff7ff;
  font-weight: 800;
}

.signal-stack {
  display: grid;
  gap: 10px;
}

.ai-signal {
  display: grid;
  gap: 6px;
}

.ai-signal div {
  display: flex;
  justify-content: space-between;
  color: #d8f3ff;
  font-size: 13px;
}

.ai-signal i {
  height: 10px;
  padding: 2px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.14);
  overflow: hidden;
}

.ai-signal em {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #22d3ee, #34d399, #a78bfa);
  box-shadow: 0 0 16px rgba(34, 211, 238, 0.32);
}

.push-window {
  display: grid;
  gap: 8px;
  padding: 12px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(186, 230, 253, 0.2);
}

.push-window h3 {
  margin: 0 0 2px;
}

.onsite-auth-card,
.live-consent-banner,
.case-recommend-strip {
  margin-bottom: 16px;
}

.onsite-auth-card {
  display: grid;
  gap: 14px;
  padding: 18px;
  border-radius: 16px;
  background:
    radial-gradient(circle at 8% 16%, rgba(31, 95, 191, 0.12), transparent 26%),
    linear-gradient(135deg, #f8fbff, #ffffff);
  border: 1px solid #cfe0f8;
  box-shadow: 0 12px 30px rgba(31, 95, 191, 0.1);
}

.auth-agent-head {
  display: grid;
  grid-template-columns: 48px minmax(0, 1fr);
  gap: 12px;
  align-items: start;
}

.agent-orb.small {
  width: 48px;
  height: 48px;
  font-size: 18px;
}

.auth-agent-head h3,
.auth-agent-head p {
  margin: 0;
}

.auth-agent-head p {
  margin-top: 6px;
  color: #5f6f86;
  line-height: 1.65;
}

.auth-pipeline,
.dual-consent {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.auth-pipeline span,
.dual-consent span {
  min-height: 32px;
  display: inline-flex;
  align-items: center;
  padding: 0 10px;
  border-radius: 999px;
  color: #5f6f86;
  background: #f1f5f9;
  border: 1px solid #dfe7f1;
  font-size: 12px;
}

.auth-pipeline span.done,
.dual-consent span.done {
  color: #065f46;
  background: #ecfdf5;
  border-color: #bbf7d0;
}

.auth-pipeline span.active {
  color: #92400e;
  background: #fff7ed;
  border-color: #fed7aa;
}

.onsite-match-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 10px;
}

.onsite-match-card {
  display: grid;
  gap: 8px;
  padding: 12px;
  border-radius: 12px;
  background: #fff;
  border: 1px solid #dfe7f1;
}

.onsite-match-card.best {
  border-color: #f59e0b;
  box-shadow: 0 10px 24px rgba(245, 158, 11, 0.12);
}

.onsite-match-card b {
  color: #1a1f2c;
}

.onsite-match-card strong {
  color: #1f5fbf;
  font-size: 20px;
}

.onsite-match-card p,
.onsite-match-card small {
  margin: 0;
  color: #5f6f86;
  line-height: 1.55;
}

.authorization-consent {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}

.authorization-consent div {
  padding: 12px;
  border-radius: 12px;
  background: #f8fbff;
  border: 1px solid #dfe7f1;
}

.authorization-consent b {
  display: block;
  margin-bottom: 4px;
  color: #173f88;
}

.authorization-consent span {
  color: #5f6f86;
  font-size: 13px;
}

.algorithm-route-card {
  display: grid;
  gap: 8px;
  margin-bottom: 14px;
  padding: 14px;
  border-radius: 14px;
  background:
    radial-gradient(circle at 90% 12%, rgba(230, 107, 34, 0.12), transparent 28%),
    linear-gradient(135deg, #ffffff, #f8fbff);
  border: 1px solid #cfe0f8;
}

.algorithm-route-card b {
  color: #173f88;
  font-size: 16px;
}

.algorithm-route-card > span {
  width: fit-content;
  min-height: 28px;
  display: inline-flex;
  align-items: center;
  padding: 0 10px;
  border-radius: 999px;
  color: #92400e;
  background: #fff7ed;
  border: 1px solid #fed7aa;
  font-size: 12px;
  font-weight: 800;
}

.algorithm-route-card p {
  margin: 0;
  color: #5f6f86;
  line-height: 1.6;
}

.manager-mini-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.manager-mini-list span {
  min-height: 30px;
  display: inline-flex;
  align-items: center;
  padding: 0 10px;
  border-radius: 999px;
  color: #065f46;
  background: #ecfdf5;
  border: 1px solid #bbf7d0;
  font-size: 12px;
  font-weight: 800;
}

.live-consent-banner {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  padding: 14px;
  border-radius: 14px;
  background: linear-gradient(135deg, #edf4ff, #ffffff);
  border: 1px solid #cfe0f8;
}

.live-consent-banner p {
  margin: 4px 0 0;
  color: #5f6f86;
}

.case-recommend-strip {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}

.case-chip {
  display: grid;
  gap: 4px;
  padding: 12px;
  border-radius: 12px;
  background: #f8fbff;
  border: 1px solid #dfe7f1;
}

.case-chip.best {
  background: #fff7ed;
  border-color: #fed7aa;
}

.case-chip span,
.case-chip em {
  color: #5f6f86;
  font-size: 12px;
  font-style: normal;
}

.case-chip b {
  color: #1a1f2c;
  line-height: 1.45;
}

.case-chip em {
  color: #1f5fbf;
  font-weight: 900;
}

.push-item {
  display: grid;
  grid-template-columns: 46px minmax(0, 1fr);
  gap: 8px;
  padding: 9px;
  border-radius: 12px;
  background: rgba(15, 23, 42, 0.36);
}

.push-item time {
  color: #67e8f9;
  font-size: 12px;
  font-weight: 800;
}

.push-item span {
  color: #cde8f4;
  line-height: 1.45;
  font-size: 13px;
}

.cockpit-action {
  width: 100%;
}

.chat {
  display: grid;
  grid-template-rows: auto minmax(260px, 1fr) auto;
  height: 560px;
}

.messages {
  overflow: auto;
  padding: 12px;
  background: #f8fafc;
  border: 1px solid var(--line);
  border-radius: 8px;
}

.message {
  max-width: 76%;
  margin: 0 0 10px;
  padding: 10px 12px;
  border-radius: 8px;
  line-height: 1.5;
  background: #e8eef7;
}

.message.enterprise {
  margin-left: auto;
  background: var(--green-soft);
}

.message.agent {
  background: var(--orange-soft);
}

.message.enterpriseAgent {
  margin-left: auto;
  background: #e7f5f1;
  border: 1px solid #b7e1d7;
}

.message.expertAgent {
  background: #eef2ff;
  border: 1px solid #c7d2fe;
}

.message.specialist {
  background: #eef2ff;
  border: 1px solid #bfdbfe;
}

.message.lobsterDemand {
  margin-left: auto;
  background: #fff7ed;
  border: 1px solid #fdba74;
}

.message.lobsterExpert {
  background: #eff6ff;
  border: 1px solid #93c5fd;
}

.message.lobsterDemand::before,
.message.lobsterExpert::before {
  display: block;
  margin-bottom: 4px;
  font-size: 12px;
  font-weight: 800;
}

.message.lobsterDemand::before {
  content: "科小果-需求方";
  color: #c2410c;
}

.message.lobsterExpert::before {
  content: "科小果-专家方";
  color: #1d4ed8;
}

.chat-form {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto auto auto;
  gap: 10px;
  margin-top: 12px;
}

.prompt-mini {
  min-width: 48px;
  min-height: 38px;
  padding: 0 10px;
  border-radius: 7px;
  color: #075869;
  background: #e0fbff;
  border: 1px solid #a5f3fc;
  font-size: 13px;
  font-weight: 800;
}

.prompt-mini:hover {
  color: #ffffff;
  background: linear-gradient(135deg, #067a8a, #246bfe);
}

.search-toggle {
  min-height: 38px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 0 12px;
  border: 1px solid #ccd5df;
  border-radius: 7px;
  color: #425062;
  background: #fff;
  white-space: nowrap;
}

.search-toggle input {
  width: auto;
}

.agent-empty {
  min-height: 360px;
  display: grid;
  place-items: center;
  align-content: center;
  gap: 14px;
  text-align: center;
  border: 1px dashed #cbd5e1;
  border-radius: 8px;
  background: #f8fafc;
}

.agent-square {
  display: grid;
  gap: 18px;
}

.agent-layout {
  display: grid;
  grid-template-columns: 330px minmax(0, 1fr);
  gap: 18px;
}

.agent-roster {
  display: grid;
  gap: 10px;
}

.agent-role {
  display: grid;
  grid-template-columns: 42px minmax(0, 1fr);
  gap: 4px 10px;
  min-height: 78px;
  padding: 12px;
  text-align: left;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
}

.agent-role i {
  grid-row: span 2;
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  color: #fff;
  background: linear-gradient(135deg, #067a8a, #246bfe);
  font-style: normal;
  font-weight: 900;
}

.agent-role b {
  color: #1f2937;
}

.agent-role span {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.45;
}

.agent-role.active {
  border-color: #0f766e;
  background: #e7f5f1;
  box-shadow: inset 4px 0 0 #0f766e;
}

.side-tool-dock {
  position: fixed;
  right: 18px;
  top: 190px;
  z-index: 35;
  display: grid;
  gap: 8px;
}

.side-tool-dock button {
  width: 88px;
  min-height: 42px;
  padding: 8px;
  border-radius: 999px;
  color: #eaf7ff;
  background: rgba(8, 31, 86, 0.72);
  border: 1px solid rgba(125, 211, 252, 0.36);
  box-shadow: 0 12px 28px rgba(8, 31, 86, 0.2);
  backdrop-filter: blur(14px);
}

.side-tool-dock button:hover {
  background: linear-gradient(135deg, #1d4ed8, #05b6d6);
}

.agent-console {
  display: grid;
  grid-template-rows: auto minmax(280px, 430px) auto;
  gap: 12px;
}

.console-head {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 12px;
  border-radius: 8px;
  background: #f8fafc;
  border: 1px solid var(--line);
}

.console-head h3,
.console-head p {
  margin: 0;
}

.agent-suggested {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 10px;
  align-items: center;
  padding: 10px 12px;
  border-radius: 8px;
  background: #f0f9ff;
  border: 1px solid #bae6fd;
}

.agent-suggested span {
  color: #075869;
  font-size: 12px;
  font-weight: 800;
}

.agent-suggested button {
  min-height: 34px;
  padding: 0;
  text-align: left;
  color: #1d4ed8;
  background: transparent;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.agent-orb {
  width: 54px;
  height: 54px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  color: #fff;
  background: linear-gradient(135deg, #0f766e, #2563eb);
  font-weight: 800;
}

.specialist-messages,
.staged-messages {
  min-height: 320px;
  max-height: 520px;
}

.staged-chat .panel-header {
  align-items: center;
}

.match-spectacle {
  display: grid;
  grid-template-columns: 180px minmax(0, 1fr) 260px;
  gap: 18px;
  align-items: center;
  margin-bottom: 14px;
  padding: 16px;
  border-radius: 8px;
  background:
    linear-gradient(135deg, rgba(15, 118, 110, 0.09), rgba(37, 99, 235, 0.08)),
    #fff;
  border: 1px solid #cfe4df;
}

.match-ring {
  width: 152px;
  height: 152px;
  display: grid;
  place-items: center;
  align-content: center;
  border-radius: 50%;
  background:
    radial-gradient(circle at center, #fff 0 56%, transparent 57%),
    conic-gradient(#0f766e 0 96%, #e2e8f0 96% 100%);
  box-shadow: 0 14px 34px rgba(15, 118, 110, 0.2);
}

.staged-chat .match-spectacle {
  position: relative;
  overflow: hidden;
  border-radius: 18px;
  padding: 18px;
  background:
    radial-gradient(circle at 12% 20%, rgba(31, 95, 191, 0.18), transparent 28%),
    radial-gradient(circle at 86% 18%, rgba(230, 107, 34, 0.16), transparent 24%),
    linear-gradient(135deg, #f8fbff, #ffffff);
  border: 1px solid #dfe7f1;
}

.staged-chat .match-spectacle::before {
  content: "";
  position: absolute;
  left: -20%;
  right: -20%;
  top: 0;
  height: 3px;
  background: linear-gradient(90deg, transparent, #1f5fbf, #22d3ee, #e66b22, transparent);
  animation: signalMove 2.2s linear infinite;
}

.staged-chat .match-ring {
  background:
    radial-gradient(circle at center, #fff 0 56%, transparent 57%),
    conic-gradient(#1f5fbf 0 72%, #22d3ee 72% 88%, #e66b22 88% 96%, #e2e8f0 96% 100%);
  box-shadow: 0 18px 42px rgba(31, 95, 191, 0.22), 0 0 0 12px rgba(31, 95, 191, 0.05);
}

.match-ring strong {
  color: #0f766e;
  font-size: 34px;
}

.match-ring span {
  color: var(--muted);
  font-size: 13px;
}

.match-bars {
  display: grid;
  gap: 12px;
}

.match-metric {
  display: grid;
  grid-template-columns: 86px minmax(0, 1fr) 44px;
  gap: 10px;

/* Reference portal skin: white government-service layout inspired by the provided demo. */
:root {
  --bg: #f3f6fa;
  --panel: #ffffff;
  --panel-strong: #ffffff;
  --line: #dfe7f1;
  --text: #1a1f2c;
  --muted: #5f6f86;
  --primary: #1f5fbf;
  --primary-dark: #173f88;
  --accent: #e66b22;
  --blue: #1f5fbf;
  --cyan: #2385df;
  --shadow: 0 10px 24px rgba(28, 58, 108, 0.1);
  --jelly-border: 1px solid rgba(255, 255, 255, 0);
}

body {
  background: #f3f6fa;
  color: var(--text);
}

.app-shell.portal-shell {
  display: grid;
  grid-template-columns: 92px minmax(0, 1fr);
  min-height: 100vh;
  background: #f3f6fa;
}

.sidebar.site-header {
  position: sticky;
  top: 0;
  align-self: start;
  width: 92px;
  min-height: 100vh;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  gap: 0;
  padding: 0;
  color: #243449;
  background: #ffffff;
  border-right: 1px solid #dfe7f1;
  border-bottom: 0;
  box-shadow: 5px 0 18px rgba(33, 53, 94, 0.06);
}

.brand {
  min-width: 0;

  place-items: center;

/* Leadership demo cockpit */
.leadership-cockpit {
  position: relative;
  display: grid;
  grid-template-columns: minmax(360px, 0.85fr) minmax(360px, 0.75fr) minmax(320px, 0.7fr);
  gap: 18px;
  padding: 26px;
  min-height: 680px;
  overflow: hidden;
  color: #f8fbff;
  border-radius: 30px;
  background:
    radial-gradient(circle at 18% 18%, rgba(34, 211, 238, 0.34), transparent 31%),
    radial-gradient(circle at 82% 16%, rgba(52, 211, 153, 0.22), transparent 30%),
    radial-gradient(circle at 65% 80%, rgba(99, 102, 241, 0.22), transparent 34%),
    linear-gradient(135deg, #06172d, #082f49 46%, #064e3b);
  box-shadow: 0 34px 100px rgba(8, 47, 73, 0.38);
}

.leadership-cockpit::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(rgba(125, 211, 252, 0.08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(125, 211, 252, 0.08) 1px, transparent 1px);
  background-size: 42px 42px;
  mask-image: linear-gradient(180deg, #000, rgba(0, 0, 0, 0.36));
  pointer-events: none;
}

.leadership-cockpit::after {
  content: "";
  position: absolute;
  left: -30%;
  right: -30%;
  top: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, #67e8f9, #a7f3d0, transparent);
  animation: cockpitScan 4.2s linear infinite;
  box-shadow: 0 0 24px rgba(103, 232, 249, 0.8);
}

@keyframes cockpitScan {
  from { transform: translateY(0); }
  to { transform: translateY(680px); }
}

.leadership-cockpit > * {
  position: relative;
  z-index: 1;
}

.henan-svg-map {
  position: absolute;
  z-index: 2;

  top: 50%;

}

.henan-district.d2,
.henan-district.d7,
.henan-district.d10 {

}

.henan-district.d3,
.henan-district.d8,
.henan-district.d11 {

.henan-district.d4,

.heat-core.luoyang { animation-delay: .35s; }
.heat-core.xinxiang { animation-delay: .7s; }
.heat-core.xuchang { animation-delay: 1.05s; }
.heat-core.nanyang { animation-delay: 1.4s; }

.flow-line {
  fill: none;
  stroke: rgba(125, 211, 252, 0.78);
  stroke-width: 4;
  stroke-linecap: round;
  stroke-dasharray: 10 16;
  filter: drop-shadow(0 0 12px rgba(125, 211, 252, 0.72));

}

.flow-line.delay {
  stroke: rgba(52, 211, 153, 0.78);
  animation-delay: .6s;
}

.flow-line.slow {
  stroke: rgba(250, 204, 21, 0.74);
  animation-duration: 3.4s;
}

@keyframes heatPulse {
  0%, 100% { opacity: .38; transform: scale(.88); }
  50% { opacity: .94; transform: scale(1.12); }
}

@keyframes mapBreath {
  0%, 100% { opacity: .82; }

}

@keyframes provinceLine {
  to { stroke-dashoffset: -104; }
}

.province-map::before,
.province-map::after {
  content: "";
  position: absolute;
  z-index: 1;
  inset: 28px;
  border: 1px solid rgba(125, 211, 252, 0.24);

.province-map::after {

.demand-review-page {

/* 2026 homepage refresh: one clear entry point, fewer repeated showcase blocks. */
.portal {
  gap: 28px;
  padding-bottom: 56px;
}

.portal-hero {
  min-height: 560px;
  grid-template-columns: minmax(0, 1.45fr) minmax(300px, .55fr);
  align-items: center;
  gap: clamp(28px, 5vw, 72px);
  padding: clamp(42px, 6vw, 78px);
  overflow: hidden;
  border: 0;
  border-radius: 28px;
  background:
    radial-gradient(circle at 88% 14%, rgba(87, 176, 222, .28), transparent 26%),
    linear-gradient(128deg, #102f58 0%, #174b78 58%, #1a668b 100%);
  box-shadow: 0 26px 70px rgba(16, 47, 88, .2);
}

.portal-hero::after {
  right: -120px;
  bottom: -220px;
  width: 520px;
  height: 520px;
  border: 1px solid rgba(255, 255, 255, .18);
  border-radius: 50%;
  background: transparent;
  box-shadow: 0 0 0 54px rgba(255,255,255,.035), 0 0 0 108px rgba(255,255,255,.025);
}

.hero-main-copy {
  max-width: 840px;
}

.portal-hero h2 {
  max-width: 760px;
  margin: 12px 0 14px;
  color: #fff;
  font-size: clamp(36px, 4.3vw, 64px);
  line-height: 1.1;
  letter-spacing: -.04em;
}

.portal-hero h3 {
  max-width: 720px;
  margin: 0 0 28px;
  color: rgba(255, 255, 255, .78);
  font-size: clamp(17px, 1.6vw, 23px);
  font-weight: 500;
  line-height: 1.6;
}

.hero-eyebrow {
  color: #bfeaff;
  letter-spacing: .16em;
}

.nstl-search-card {
  max-width: 760px;
  padding: 18px;
  border: 1px solid rgba(255, 255, 255, .18);
  background: rgba(255, 255, 255, .96);
  box-shadow: 0 20px 52px rgba(3, 24, 50, .26);
}

.hero-focus-card {
  position: relative;
  z-index: 1;
  padding: 28px;
  color: #163d66;
  border: 1px solid rgba(255,255,255,.55);
  border-radius: 24px;
  background: rgba(255, 255, 255, .92);
  box-shadow: 0 24px 54px rgba(3, 24, 50, .24);
  backdrop-filter: blur(18px);
}

.hero-focus-card h3 {
  margin: 8px 0 18px;
  color: #163d66;
  font-size: 22px;
  font-weight: 800;
}

.hero-focus-card strong {
  display: block;
  font-size: 24px;
  line-height: 1.4;
}

.hero-focus-card p {
  margin: 14px 0 20px;
  color: rgba(22, 61, 102, .7);
  line-height: 1.75;
}

.focus-progress {
  display: grid;
  gap: 9px;
  margin-bottom: 22px;
}

.focus-progress span {
  position: relative;
  padding: 9px 12px 9px 34px;
  border-radius: 10px;
  color: #6c7e91;
  background: #eef3f7;
  font-size: 13px;
  font-weight: 700;
}

.focus-progress span::before {
  content: "";
  position: absolute;
  left: 13px;
  top: 50%;
  width: 9px;
  height: 9px;
  border: 2px solid #aab8c5;
  border-radius: 50%;
  transform: translateY(-50%);
}

.focus-progress span.done {
  color: #174b78;
  background: #e2f2fa;
}

.focus-progress span.done::before {
  border-color: #1a668b;
  background: #1a668b;
}

.portal-band {
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 1px;
  padding: 0;
  overflow: hidden;
  border: 1px solid rgba(24, 59, 102, .1);
  border-radius: 20px;
  background: rgba(24, 59, 102, .1);
  box-shadow: 0 16px 44px rgba(24, 59, 102, .08);
}

.portal-stat {
  min-height: 118px;
  border: 0;
  border-radius: 0;
  background: #fff;
  box-shadow: none;
}

.portal-stat::before { display: none; }

.home-section-heading {
  max-width: 760px;
  margin: 42px auto 0;
  text-align: center;
}

.home-section-heading h2 {
  margin: 8px 0 10px;
  color: #183b66;
  font-size: clamp(30px, 3vw, 44px);
}

.home-section-heading p {
  margin: 0;
  color: #687b8e;
  font-size: 17px;
}

.nstl-service-flow {
  gap: 16px;
}

.nstl-service-card {
  min-height: 250px;
  padding: 26px;
  border-radius: 20px;
  transition: transform .2s ease, box-shadow .2s ease;
}

.nstl-service-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 20px 48px rgba(24, 59, 102, .14);
}

@media (max-width: 1050px) {
  .portal-hero {
    grid-template-columns: 1fr;
  }

  .hero-focus-card {
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 24px;
  }

  .hero-focus-card .eyebrow,
  .hero-focus-card h3,
  .hero-focus-card strong,
  .hero-focus-card p {
    grid-column: 1;
  }

  .hero-focus-card .focus-progress {
    grid-column: 2;
    grid-row: 1 / span 4;
  }
}

@media (max-width: 760px) {
  .portal {
    gap: 18px;
  }

  .portal-hero {
    min-height: auto;
    padding: 30px 20px;
    border-radius: 20px;
  }

  .portal-hero h2 {
    font-size: 38px;
  }

  .hero-ai-input {
    grid-template-columns: 1fr;
  }

  .hero-focus-card {
    display: block;
    padding: 22px;
  }

  .portal-band {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .portal-stat:last-child {
    grid-column: 1 / -1;
  }

  .app-shell.portal-shell .topbar {
    overflow: visible;
  }

  .app-shell.portal-shell .topbar-nav {
    width: 100%;
    max-width: 100%;
    justify-content: flex-start;
    overflow-x: auto;
    overscroll-behavior-inline: contain;
    scrollbar-width: none;
  }

  .app-shell.portal-shell .topbar-nav::-webkit-scrollbar {
    display: none;
  }

  .app-shell.portal-shell .topbar-nav button {
    flex: 0 0 auto;
    min-width: 96px;
  }
}

/* Matching workspace — light, readable command dashboard. */
.match-page-panel {
  padding: clamp(18px, 2.4vw, 30px) !important;
  background: #fff !important;
}

.match-page-panel > .panel-header {
  display: grid;
  grid-template-columns: minmax(190px, .55fr) minmax(360px, 1.45fr);
  align-items: end;
  gap: 22px;
  margin-bottom: 22px;
}

.match-page-panel > .panel-header h2 {
  margin: 0 0 8px;
  font-size: 28px;
}

.match-page-panel > .panel-header .eyebrow {
  font-size: 11px;
  letter-spacing: .12em;
}

.match-page-panel > .panel-header select {
  width: 100%;
  min-height: 50px;
  padding-inline: 16px 44px;
  border-radius: 14px !important;
  font-size: 16px;
  font-weight: 650;
}

.match-command-deck {
  grid-template-columns: minmax(0, 1fr) minmax(300px, 360px);
  gap: clamp(22px, 3vw, 42px);
  padding: clamp(24px, 3vw, 38px);
  margin-bottom: 20px;
  border: 1px solid #d7e5f3 !important;
  border-radius: 24px;
  color: var(--tech-ink) !important;
  background:
    radial-gradient(circle at 95% 8%, rgba(14, 165, 233, .11), transparent 28%),
    linear-gradient(135deg, #f8fbff 0%, #f1f7fd 100%) !important;
  box-shadow: 0 18px 46px rgba(23, 48, 77, .08) !important;
}

.match-command-deck::before {
  opacity: .65;
  background:
    linear-gradient(rgba(37, 99, 235, .045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(37, 99, 235, .045) 1px, transparent 1px) !important;
  background-size: 34px 34px !important;
  mask-image: linear-gradient(90deg, #000, transparent 78%);
}

.match-command-deck .eyebrow {
  color: var(--tech-blue) !important;
  background: #fff !important;
  border-color: #cfe2f6 !important;
}

.command-main h2,
.match-page-panel .command-main h2 {
  max-width: 900px;
  margin: 14px 0 24px;
  color: var(--tech-ink) !important;
  font-size: clamp(25px, 2.4vw, 36px);
  line-height: 1.35;
  letter-spacing: -.02em;
  overflow-wrap: anywhere;
}

.command-kpis {
  grid-template-columns: repeat(5, minmax(112px, 1fr));
  gap: 12px;
}

.command-kpis article {
  min-height: 112px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 17px;
  border: 1px solid #d8e5f1 !important;
  border-radius: 16px;
  color: var(--tech-ink) !important;
  background: rgba(255, 255, 255, .9) !important;
  box-shadow: 0 9px 24px rgba(23, 48, 77, .06) !important;
}

.command-kpis span {
  color: #718096 !important;
  font-size: 12px;
  font-weight: 650;
}

.command-kpis b {
  margin-top: 12px;
  color: var(--tech-blue) !important;
  font-size: clamp(24px, 2vw, 34px);
  line-height: 1.05;
  white-space: nowrap;
}

.command-radar {
  min-height: 310px;
  align-self: center;
  border: 1px solid #d7e7f5;
  border-radius: 50%;
  background:
    radial-gradient(circle at center, rgba(14, 165, 233, .12), rgba(37, 99, 235, .035) 44%, transparent 68%) !important;
}

.command-radar::before,
.command-radar::after {
  border-color: rgba(37, 99, 235, .22) !important;
}

.command-radar strong {
  width: 100px;
  height: 100px;
  color: #fff !important;
  font-size: 27px;
  background: linear-gradient(135deg, var(--tech-blue), var(--tech-cyan)) !important;
  box-shadow: 0 14px 34px rgba(37, 99, 235, .24) !important;
}

.command-radar span {
  min-width: 68px;
  min-height: 34px;
  color: #285784 !important;
  background: rgba(255, 255, 255, .94) !important;
  border-color: #c9deef !important;
  box-shadow: 0 5px 14px rgba(23, 48, 77, .08) !important;
  font-size: 12px;
  font-weight: 700;
}

.match-page-panel .live-consent-banner {
  gap: 24px;
  padding: 20px 22px;
  border: 1px solid #d3e4f7 !important;
  border-radius: 18px;
  background: linear-gradient(90deg, #f5f9ff, #fff) !important;
  box-shadow: none !important;
}

.match-page-panel .live-consent-banner b {
  color: var(--tech-ink) !important;
  font-size: 18px;
}

  margin: 6px 0 0;
  color: #677991 !important;
  line-height: 1.7;
}

  flex: 0 0 auto;
  min-width: 166px;
}

@media (max-width: 1240px) {
  .match-command-deck {
    grid-template-columns: 1fr;
  }

  .command-radar {
    width: min(100%, 420px);
    min-height: 340px;
    margin: 4px auto 0;
  }
}

@media (max-width: 900px) {
  .match-page-panel > .panel-header {
    grid-template-columns: 1fr;
    align-items: stretch;
  }

  .command-kpis {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .command-kpis article:last-child {
    grid-column: 1 / -1;
  }

  .match-page-panel .live-consent-banner {
    display: grid;
  }

  .match-page-panel .live-consent-banner .primary {
    width: 100%;
  }
}

@media (max-width: 560px) {
  .match-page-panel {
    padding: 14px !important;
  }

  .match-command-deck {
    padding: 18px;
    border-radius: 18px;
  }

  .command-kpis {
    grid-template-columns: 1fr;
  }

  .command-kpis article:last-child {
    grid-column: auto;
  }

  .command-radar {
    min-height: 290px;
  }
}

.agent-recommended-questions > div {

}

.agent-recommended-questions button {
  padding: 8px 12px;
  border: 1px solid #c9dcf5;
  border-radius: 999px;
  background: #fff;
  color: #1d5fbd;
  font: inherit;
  font-size: 13px;
  text-align: left;
  cursor: pointer;
}

.agent-recommended-questions button:hover {
  border-color: #4f8ff7;
  background: #eaf3ff;
}

function NegotiationRoom({ user, selectedDemand, conversation }) {
  const [rooms, setRooms] = useState([]);
  const [activeRoom, setActiveRoom] = useState(null);
  const [messages, setMessages] = useState([]);
  const [draft, setDraft] = useState("");
  const [loading, setLoading] = useState(false);
  const [autoReplying, setAutoReplying] = useState(false);
  const [notice, setNotice] = useState("");

  useEffect(() => { loadRooms(false); }, [user.id]);
  useEffect(() => {
    if (!activeRoom?.id) return undefined;
    loadRoom(activeRoom.id);
    const timer = setInterval(() => loadRoom(activeRoom.id, true), 2500);
    return () => clearInterval(timer);
  }, [activeRoom?.id]);

  async function loadRooms(ensureRoom = false) {
    const result = await api.get(`/api/negotiation-rooms?userId=${user.id}`);
    if (result.rooms.length) {
      setRooms(result.rooms);
      if (!activeRoom) setActiveRoom(result.rooms.find((item) => item.id === conversation?.id) || result.rooms[0]);
      return;
    }
    setRooms([]);
    setActiveRoom(null);
    setMessages([]);
    if (ensureRoom) {
      const created = await api.post("/api/negotiation-rooms/start", { userId: user.id, demandId: selectedDemand?.id });
      setRooms([created.room]);
      setActiveRoom(created.room);
    }
  }

  async function loadRoom(id, quiet = false) {
    try {
      const result = await api.get(`/api/conversations/${id}`);
      setMessages(result.messages || []);
      if (!quiet) setNotice("");
    } catch (error) {
      if (!quiet) setNotice(error.message);
    }
  }

  async function sendMessage(event) {
    event.preventDefault();
    if (!draft.trim() || !activeRoom) return;
    const text = draft.trim();
    const roomId = activeRoom.id;
    setDraft("");
    const result = await api.post(`/api/negotiation-rooms/${roomId}/messages`, { userId: user.id, text });
    setMessages((items) => [...items, result.message]);
    await loadRoom(roomId, true);
    const replyRole = user.role === "enterprise" ? "expertAgent" : user.role === "expert" ? "enterpriseAgent" : "";
    if (replyRole) {
      setAutoReplying(true);
      setTimeout(async () => {
        try {
          const reply = await api.post(`/api/negotiation-rooms/${roomId}/agent-step`, { userId: user.id, agentRole: replyRole, webSearch: true });
          setMessages((items) => [...items, reply.message]);
          await loadRoom(roomId, true);
        } catch (error) {
          setNotice(error.message);
        } finally {
          setAutoReplying(false);
        }
      }, 2200);
    }
  }

  async function startRoom() {
    setLoading(true);
    const created = await api.post("/api/negotiation-rooms/start", { userId: user.id, demandId: selectedDemand?.id, reset: true });
    setActiveRoom(created.room);
    setRooms((items) => [created.room, ...items.filter((item) => item.id !== created.room.id)]);
    await loadRoom(created.room.id);
    setLoading(false);
  }

  async function agentStep(agentRole) {
    if (!activeRoom) return;
    setLoading(true);
    const result = await api.post(`/api/negotiation-rooms/${activeRoom.id}/agent-step`, { userId: user.id, agentRole, webSearch: true });
    setMessages((items) => [...items, result.message]);
    await loadRoom(activeRoom.id, true);
    setLoading(false);
  }

  const room = activeRoom || rooms[0];
  const demand = room?.demand || {};
  const expert = room?.expert || {};
  const roleAgent = user.role === "expert" ? "expertAgent" : user.role === "manager" || user.role === "admin" ? "managerAgent" : "enterpriseAgent";
  const isAdmin = user.role === "admin";

  return React.createElement("div", { className: "negotiation-page" },
    React.createElement("section", { className: "negotiation-hero" },
      React.createElement("div", null,
        React.createElement("span", { className: "eyebrow" }, "One-to-One Matching Room"),
        React.createElement("h2", null, isAdmin ? "平台磋商监管室" : "供需双方智能体磋商室"),
        React.createElement("p", null, isAdmin ? "管理员可查看全平台一对一供需匹配房间，必要时让科小企、科小专、科小经分别补充发言，形成监管和服务记录。" : "这里不是单页演示，而是一对一供需匹配房间。企业端、专家端登录后进入同一房间，消息会存档并同步刷新。")
      ),
      React.createElement("button", { className: "primary", onClick: startRoom, disabled: loading }, loading ? "进入中" : isAdmin ? "新建监管房间" : "新建空白磋商室")
    ),
    notice && React.createElement("div", { className: "admin-notice" }, notice),
    React.createElement("section", { className: "negotiation-layout" },
      React.createElement("aside", { className: "panel room-list" },
        React.createElement("h2", null, "磋商房间"),
        rooms.map((item) => React.createElement("button", {
          key: item.id,
          className: room?.id === item.id ? "active" : "",
          onClick: () => setActiveRoom(item)
        },
          React.createElement("b", null, item.demand?.name || item.title),
          React.createElement("span", null, `${item.demand?.company || "企业方"} × ${item.expert?.name || "专家方"}`),
          React.createElement("small", null, `${item.messageCount || 0}条记录｜匹配${item.matchScore || "--"}%`)
        ))
      ),
      React.createElement("main", { className: "panel negotiation-chat" },
        React.createElement("div", { className: "negotiation-title" },

            React.createElement("span", { className: "eyebrow" }, room ? `${demand.company || "企业"}｜${expert.organization || "专家单位"}｜${room.status || "磋商中"}` : "请选择或新建房间")
          ),

function textHasAny(text, words) {
  return words.some((word) => text.includes(word));
}

function simpleMoney(value) {
  const text = String(value || "").replace(/,/g, "");
  if (!text || /面议|未说明|无/.test(text)) return 0;
  const match = text.match(/([0-9]+(?:\.[0-9]+)?)/);
  if (!match) return 0;
  let amount = Number(match[1]);
  if (text.includes("亿")) amount *= 100000000;
  if (text.includes("万")) amount *= 10000;
  return amount;
}

function evaluateDemandDraft(form) {
  const platformWords = ["交易市场", "科技创新中心", "情报研究所", "代理企业", "服务中心", "产业园", "发展中心", "运营公司", "协会", "平台"];
  const industryWords = ["新材料", "人工智能", "现代农业", "生物医药", "电子信息", "新能源", "节能环保", "高端装备", "智能制造", "食品", "化工", "医疗器械", "无人机", "机器人", "传感器", "储能", "种业", "大棚", "铝合金", "腐蚀", "焊接", "产线", "工艺", "材料", "装备"];
  const quantWords = ["≥", "≤", "%", "MPa", "GPa", "km", "kg", "nm", "微米", "小时", "秒", "吨", "万元", "准确率", "良率", "成本", "半径", "载重", "ppm", "kWh", "℃"];
  const foundationWords = ["产线", "车间", "设备", "实验室", "样品", "样件", "试点", "中试", "客户", "团队", "数据", "台架", "平台", "专利", "订单", "批量", "供应商"];
  const scenarioWords = ["生产", "应用", "场景", "工艺", "产品", "产线", "试点", "客户", "运营", "示范", "交付", "产业化", "采购", "验证", "验收", "质量", "供应链"];
  const vague = /未说明|面议|其他|暂无|无。?$|待定|不详|技术指标面议|根据需要|看情况|越高越好|越低越好|尽快|先进水平/;
  const contradictionPairs = [
    [/预算.{0,8}(0|无|没有|不投入)/, /预算|万元|采购|联合开发/],
    [/无基础|没有基础|暂无基础/, /产线|设备|实验室|中试|客户|订单|数据/],
    [/无指标|指标待定|技术指标面议/, /≥|≤|准确率|良率|强度|小时|吨|%/],
    [/仅咨询|了解一下/, /采购|长期供应|联合开发|预算|样件/]
  ];
  const risks = [];

  const name = String(form.name || "");
  const company = String(form.company || "");
  const field = String(form.field || "");
  const keywords = String(form.keywords || "");
  const detail = String(form.detail || "");
  const indicators = String(form.technicalIndicators || "");
  const problem = String(form.problem || "");
  const foundation = String(form.foundation || "");
  const allText = [name, company, field, keywords, detail, indicators, problem, foundation, form.cooperation, form.orgType, form.region, form.source].join("");
  const budgetAmount = simpleMoney(form.budgetText || form.budgetAmount || form.budget);

  let problemClarity = 0;
  const textLength = [name, detail, problem, foundation, indicators].join("").replace(/\s+/g, "").length;
  if (textLength >= 220) problemClarity += 5;
  else if (textLength >= 150) problemClarity += 4;
  else if (textLength >= 90) problemClarity += 3;
  else if (textLength >= 50) problemClarity += 2;
  if (name.length >= 8 && !vague.test(name)) problemClarity += 2;
  if (detail.length >= 40 && !vague.test(detail)) problemClarity += 3;
  if (problem.length >= 25 && !vague.test(problem)) problemClarity += 4;
  if (/痛点|瓶颈|替代|升级|降本|提质|效率|安全|质量|稳定|可靠|国产化|规模化|注册|量产/.test(`${detail}${problem}`)) problemClarity += 1;
  if (detail.length < 30) risks.push("需求详情字数不足");
  if (problem.length < 15) risks.push("技术难题描述过短");

  let technical = 0;
  const numericCount = (indicators.match(/\d+(?:\.\d+)?|≥|≤|不低于|不高于|以内|以上|以下/g) || []).length;
  if (numericCount >= 3 || textHasAny(indicators, quantWords)) technical += 9;
  else if (numericCount >= 1) technical += 5;
  if (/验收|准确率|良率|成本|寿命|误报率|响应|时间|强度|半径|载重|去除率|回收率|盐雾|焊接|能耗/.test(indicators)) technical += 6;
  if (indicators.length >= 35 && !vague.test(indicators)) technical += 5;
  if (!indicators || vague.test(indicators)) risks.push("技术指标不可验证");

  let industryFit = 0;
  if (field && textHasAny(`${field}${keywords}${name}${detail}`, industryWords)) industryFit += 7;
  if (textHasAny(allText, industryWords)) industryFit += 5;
  if (field && detail && textHasAny(detail, field.split(/[，,、;；\s]/).filter(Boolean))) industryFit += 3;
  if (!field) risks.push("缺少技术领域");

  let enterpriseCredibility = 0;
  if (company && !textHasAny(company, platformWords)) enterpriseCredibility += 6;
  if (/企业|公司|集团|厂|有限|股份/.test(company) || /企业|民营|国有|高新/.test(String(form.orgType || ""))) enterpriseCredibility += 5;
  if (form.contact || /联系人|电话|邮箱|手机/.test(allText)) enterpriseCredibility += 2;
  if (form.region) enterpriseCredibility += 2;
  if (textHasAny(company, platformWords)) risks.push("非企业本体或平台代填");
  if (!company) risks.push("缺少企业主体");

  let implementationReadiness = 0;
  if (textHasAny(detail, scenarioWords) || textHasAny(allText, scenarioWords)) implementationReadiness += 5;
  if (textHasAny(foundation, foundationWords)) implementationReadiness += 5;
  if (budgetAmount > 0) implementationReadiness += 4;
  if (form.cooperation && !vague.test(String(form.cooperation))) implementationReadiness += 3;
  if (form.validUntilText || form.validUntil || form.source) implementationReadiness += 2;
  if (/样件|测试|中试|试点|验证|采购|订单|客户|交付|量产/.test(allText)) implementationReadiness += 1;
  if (!foundation || vague.test(foundation)) risks.push("现有基础不足");
  if (!budgetAmount) risks.push("预算金额未量化");

  let consistencyRisk = 15;
  contradictionPairs.forEach(([negative, positive]) => {
    if (negative.test(allText) && positive.test(allText)) consistencyRisk -= 5;
  });
  if (budgetAmount > 500000000 && !/集团|上市|大型|央企|国企/.test(`${company}${form.orgType || ""}`)) {
    consistencyRisk -= 3;
    risks.push("预算与企业规模疑似不匹配");
  }
  if (consistencyRisk < 15) risks.push("文本存在前后矛盾或口径冲突");

  const dimensions = {
    enterpriseCredibility: Math.min(enterpriseCredibility, 15),
    problemClarity: Math.min(problemClarity, 15),
    technicalVerifiability: Math.min(technical, 20),
    industryFit: Math.min(industryFit, 15),
    implementationReadiness: Math.min(implementationReadiness, 20),
    consistencyRisk: Math.max(0, Math.min(consistencyRisk, 15))
  };
  // 真实性属于风险评估，不给绝对满分；即使字段完整，仍保留人工核验空间。
  const score = Math.min(99, Math.round(Object.values(dimensions).reduce((sum, value) => sum + value, 0)));
  return {
    score,
    level: score >= 80 ? "高可信" : score >= 60 ? "基本可信" : score >= 40 ? "疑似虚假" : "虚假/高风险",
    verdict: score >= 60 ? "真实需求" : "虚假需求",
    recommendation: score >= 80 ? "优先对接" : score >= 60 ? "补充访谈后对接" : score >= 40 ? "人工复核并要求补证" : "判定虚假，暂缓入库",
    riskTags: [...new Set(risks)],
    dimensions
  };
}

function Pagination({ page, totalPages, total, pageSize, onPageChange }) {
  if (!total) return null;
  const pageNumbers = [];
  let previousPage = 0;
  for (let current = 1; current <= totalPages; current += 1) {
    if (current === 1 || current === totalPages || Math.abs(current - page) <= 2) {
      if (previousPage && current - previousPage > 1) pageNumbers.push(`gap-${previousPage}`);
      pageNumbers.push(current);
      previousPage = current;
    }
  }
  return React.createElement("nav", { className: "pagination-bar", "aria-label": "分页导航" },
    React.createElement("span", { className: "pagination-summary" }, `第 ${page} / ${totalPages} 页 · 每页 ${pageSize} 条 · 共 ${total} 条`),
    React.createElement("div", { className: "pagination-controls" },

      pageNumbers.map((item) => typeof item === "number"
        ? React.createElement("button", { type: "button", className: item === page ? "pagination-page active" : "pagination-page", key: item, onClick: () => onPageChange(item), "aria-current": item === page ? "page" : undefined }, item)

}

function evaluateAchievement(item) {
  const text = `${item.name} ${item.summary} ${item.stage} ${item.level} ${item.keywords} ${item.transferMode}`;

  if (/中试|产业化|示范|应用|样件|量产/.test(text)) score += 18;
  if (/专利|知识产权|授权|论文|标准/.test(text)) score += 12;
  if (/新材料|智能制造|人工智能|生物医药|现代农业|新能源/.test(text)) score += 10;
  if (/许可|转让|联合开发|作价入股|合作/.test(text)) score += 8;
  score = Math.min(96, score);
  const mode = score >= 82 ? "优先进入企业匹配" : score >= 68 ? "建议补充样件/专利后推荐" : "建议技术经理人先做成果画像";

}

function getAgentRecommendedQuestions(agent) {
  const questions = String(agent?.demoQuestions || "")
    .split(/\r?\n/)
    .map((line) => line.trim())
    .filter((line) => /^(Q|问题)[：:]/i.test(line))
    .map((line) => line.replace(/^(Q|问题)[：:]\s*/i, ""))
    .filter(Boolean);
  if (questions.length) return questions;
  return agent?.prompt ? [agent.prompt] : ["请结合当前平台数据给出一份可执行的分析建议。"];
}
